<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Shiksha LMS - Nepal E-Learning Platform</title>
    <meta name="description" content="Nepal's premier e-learning platform for Loksewa, Banking, CMAT, and University entrance exams with local eSewa & Khalti payment integration, offline PWA access, and live mock tests." />
    
    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shiksha LMS - Nepal E-Learning Platform" />
    <meta property="og:description" content="Prepare for Loksewa, Banking (RBB/NBL), CMAT, and Entrance Exams with expert Nepali faculty, HD DRM video classes, and offline mock tests." />
    <meta property="og:image" content="/icon-512.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shiksha LMS - Nepal E-Learning Platform" />
    <meta name="twitter:description" content="Nepal's premier e-learning platform for Loksewa, Banking, and CMAT exams." />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shiksha" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Google Fonts for Nepali and English Typography: Inter + Noto Sans Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
